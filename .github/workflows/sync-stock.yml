# Stock de fábrica → Shopify cada 30 min (scripts/stock/sync_stock.py).
# Excel viejo (>36 h) → pasada en verde sin tocar nada. FTP caído o escrituras con error → en rojo y no
# se toca nada más; la siguiente pasada lo vuelve a intentar.
# ponytail: en repos públicos GitHub apaga los cron tras 60 días sin actividad en el
# repo; si el repo se queda quieto, reactivarlo en Actions o mover esto a un repo propio.
name: Sync stock

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min, lejos del minuto 0 (el más saturado en GitHub)
  workflow_dispatch:
    inputs:
      apply:
        description: "Escribir en Shopify (si no, sólo ensayo)"
        type: boolean
        default: false

concurrency:
  group: sync-stock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/stock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Sync
        working-directory: scripts/stock
        env:
          TZ: Europe/Madrid   # MENU!B5 viene en hora local de fábrica
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            python3 sync_stock.py --apply --report /tmp/informe.json
          else
            python3 sync_stock.py --report /tmp/informe.json
          fi
